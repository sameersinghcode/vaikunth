<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>This or That</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Figtree:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,900&display=swap">
<style>
/* SHIV KRIPA DECORS — social creative brand kit (Emerald & Gold) */
:root{
  --ink:#0E1A14; --ink-2:#142219; --ink-3:#17281E; --ink-rgb:14,26,20;
  --gold:#C9A24B; --gold-soft:#A6842F; --gold-rgb:201,162,75;
  --emerald:#1F5140; --ivory:#EDE4C8; --sage:#9DB0A2;
  --line:rgba(201,162,75,.32); --line-soft:rgba(201,162,75,.18);
  --display:'Cormorant Garamond',serif; --serif2:'Marcellus',serif; --body:'Figtree',sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.79  0 0 0 0 0.64  0 0 0 0 0.29  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink)}
.canvas{position:relative;overflow:hidden;background:var(--ink);color:var(--ivory);font-family:var(--body);font-weight:300}
.canvas::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.5;mix-blend-mode:overlay;pointer-events:none;z-index:9}
/* shared brand marks */
.logo{font-family:var(--serif2);color:var(--gold);letter-spacing:.34em;font-weight:400}
.rule{height:1px;background:var(--line)}
.eyebrow{font-family:var(--body);text-transform:uppercase;color:var(--gold);font-weight:500}
.serif{font-family:var(--display);font-weight:500;line-height:1.04;color:var(--ivory)}
.corner{position:absolute;width:54px;height:54px;border:1.5px solid var(--line);z-index:8}
.photo{position:absolute;background-size:cover;background-position:center}
.vign{position:absolute;inset:0;pointer-events:none}


  .canvas{width:1080px;height:1350px;background:var(--ink)}
  .half{position:absolute;left:0;right:0;height:620px;overflow:hidden}
  .half.top{top:0}
  .half.bot{top:620px;height:730px}
  .half .himg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .half.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--ink-rgb),.45),transparent 45%)}
  .half.bot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(var(--ink-rgb),.55) 62%,rgba(var(--ink-rgb),.97))}
  .badge{position:absolute;left:56px;z-index:6;width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:900;font-size:44px}
  .badge.a{top:120px}.badge.b{top:700px}
  .ordisc{position:absolute;top:620px;left:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;background:var(--ink);border:1.5px solid var(--gold);display:grid;place-items:center;z-index:7;font-family:var(--serif2);color:var(--gold);font-size:30px;letter-spacing:.1em}
  .hdr{position:absolute;top:48px;left:0;right:0;text-align:center;z-index:8}
  .hdr .logo{font-size:20px;letter-spacing:.32em}
  .corner{width:44px;height:44px;z-index:8}
  .corner.tl{top:38px;left:38px;border-right:none;border-bottom:none}.corner.tr{top:38px;right:38px;border-left:none;border-bottom:none}
  .corner.bl{bottom:38px;left:38px;border-right:none;border-top:none}.corner.br{bottom:38px;right:38px;border-left:none;border-top:none}
  .body{position:absolute;left:60px;right:60px;bottom:60px;text-align:center;z-index:8}
  .kick{font-family:var(--body);text-transform:uppercase;color:var(--gold);font-weight:700;font-size:18px;letter-spacing:.24em;margin-bottom:16px}
  .hook{font-family:'Playfair Display',serif;font-weight:900;font-size:82px;line-height:.95;color:var(--ivory)}
  .cta{font-family:var(--body);font-weight:600;font-size:27px;color:var(--ivory);margin-top:20px}
  .cta b{color:var(--gold)}
  .small{font-family:var(--body);font-size:18px;color:var(--sage);margin-top:10px;letter-spacing:.05em}

body{margin:0;background:#0E1A14}
.canvas{margin:0 auto 40px}
</style></head>
<body>
<div class="canvas" data-document-role="page" data-label="This or That">
  <div class="half top"><img class="himg" src="https://shivkripadecors.com/images/badshah-royal-5-1.jpg" alt="Option A sofa"></div>
  <div class="half bot"><img class="himg" src="https://shivkripadecors.com/images/meenakshi-ivory-5-1.jpg" alt="Option B sofa"></div>
  <div class="badge a">A</div><div class="badge b">B</div>
  <div class="ordisc">OR</div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="hdr"><span class="logo">SHIV KRIPA DECORS</span></div>
  <div class="body">
    <div class="kick">Pick your throne room</div>
    <div class="hook">Which one's<br>going in <em>your</em> home?</div>
    <div class="cta">Comment <b>A</b> or <b>B</b> 👇</div>
    <div class="small">Tag the person who'd pick the other one 🔁</div>
  </div>
</div>
</body></html>
